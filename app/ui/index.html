<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatbot FISC</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 16px; background: #f6f7f9; color: #1d2330; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 16px; color: #555; font-size: .9rem; }
  #log { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .msg { padding: 10px 12px; border-radius: 10px; white-space: pre-wrap; line-height: 1.4; }
  .yo { align-self: flex-end; background: #1f5fbf; color: #fff; max-width: 80%; }
  .bot { align-self: flex-start; background: #fff; border: 1px solid #dde1e7; max-width: 92%; }
  .tipo { font-size: .75rem; font-weight: 600; text-transform: uppercase; color: #6b7280; display: block; margin-bottom: 4px; }
  details { margin-top: 8px; font-size: .82rem; color: #374151; }
  details pre { white-space: pre-wrap; background: #f3f4f6; padding: 8px; border-radius: 6px; overflow-x: auto; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 10px; font-size: 1rem; border: 1px solid #c4c9d2; border-radius: 8px; }
  button { padding: 10px 16px; font-size: 1rem; border: 0; border-radius: 8px; background: #1f5fbf; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<h1>Chatbot académico FISC</h1>
<p class="sub">Plan de estudio de la Lic. en Ingeniería de Sistemas y Computación (vigente desde 2025). Pregunta por materias, semestres, prerrequisitos, inscripción o créditos.</p>
<div id="log" aria-live="polite"></div>
<form id="f">
  <label for="q" class="sr" style="position:absolute;left:-9999px">Tu pregunta</label>
  <input id="q" autocomplete="off" placeholder="Ej.: ¿Qué necesito para ver Base de Datos II?" required>
  <button>Enviar</button>
</form>
<script>
const sesion = crypto.randomUUID();
const log = document.getElementById('log');
function burbuja(cls, texto) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = texto;
  log.appendChild(d);
  d.scrollIntoView({behavior: 'smooth'});
  return d;
}
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = document.getElementById('q');
  const texto = q.value.trim();
  if (!texto) return;
  burbuja('yo', texto);
  q.value = '';
  try {
    const r = await fetch('/chat', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                    body: JSON.stringify({sesion, texto})});
    const res = await r.json();
    const d = burbuja('bot', '');
    const t = document.createElement('span');
    t.className = 'tipo';
    t.textContent = res.tipo + (res.regla ? ' · regla ' + res.regla : '');
    d.appendChild(t);
    d.appendChild(document.createTextNode(res.respuesta));
    const det = document.createElement('details');
    const sum = document.createElement('summary');
    sum.textContent = 'Explicación (¿por qué? / ¿cómo?)';
    const pre = document.createElement('pre');
    pre.textContent = 'POR QUÉ: ' + res.why + '\n\nCÓMO: ' +
      (res.how ? res.how.cypher + '\nParámetros: ' + JSON.stringify(res.how.parametros) +
                 '\nRegistros: ' + res.how.registros.length : 'sin consulta al grafo') +
      '\n\nLatencia (ms): ' + JSON.stringify(res.latencia_ms);
    det.append(sum, pre);
    d.appendChild(det);
  } catch (err) {
    burbuja('bot', 'Error de conexión con el servidor.');
  }
});
</script>
</body>
</html>
